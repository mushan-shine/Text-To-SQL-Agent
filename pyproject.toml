[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "self-healing-text2sql"
version = "0.0.1"
description = "Self-Healing Text-to-SQL Agent on Databricks — BEAVER benchmark, failure diagnosis, targeted repair"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "sqlglot>=25.0",
    "pandas>=2.0",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
# Phase 0 runs from a workstation: BEAVER's official engine (MySQL) is the
# reference oracle, Databricks SQL Warehouse is the candidate engine.
local = [
    "pymysql>=1.1",
    "databricks-sql-connector>=3.0",
    "databricks-sdk>=0.30",
    "datasets>=2.18",
]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
# NOTE: the platform-helpers package is named `dbx`, not `databricks`,
# because a top-level `databricks` package would shadow `databricks.sql`
# and `databricks.sdk`.
packages = ["benchmark", "execution", "dbx"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
